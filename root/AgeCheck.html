<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification</title>
    <link rel="stylesheet" href="SecurityStyle.css">
    <script src="AgeCheckMath.js" defer></script>
</head>
<body>
<h2>Since Garn47 is a vent game, it is only meant for mature audiences.</h2>
    <form id="ageForm">

        <label for="dob">Select your date of birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>

        <input type="checkbox" id="over18Checkbox" name="over18" required>
        <label for="over18Checkbox">I confirm that I am at least 18 years old</label><br><br>

        <label for="ageInput">Enter your age:</label>
        <input type="number" id="ageInput" name="ageInput" min="0" required><br><br>

        <button type="button" onclick="verifyAge()">Submit</button>
    </form>
</body>
</html>
